[project]
name = "data-go-mcp.its-road-traffic"
version = "0.1.0"
description = "MCP server and mobile/desktop web dashboard for nationwide road traffic and incident alerts from Korea ITS (국가교통정보센터)"
readme = "README.md"
authors = [
    { name = "Data.go.kr MCP Servers Contributors" }
]
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
keywords = ["mcp", "korea", "api", "data.go.kr", "its", "traffic", "its-road-traffic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.13.0,<2",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
# 브라우저가 닫혀 있어도 휴대폰으로 알림을 보내는 Web Push 지원
push = [
    "pywebpush>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/datago-mcp/data-go-mcp-servers"
Repository = "https://github.com/datago-mcp/data-go-mcp-servers"
Documentation = "https://github.com/datago-mcp/data-go-mcp-servers/tree/main/src/its-road-traffic"
"Bug Tracker" = "https://github.com/datago-mcp/data-go-mcp-servers/issues"
Changelog = "https://github.com/datago-mcp/data-go-mcp-servers/blob/main/src/its-road-traffic/CHANGELOG.md"

[project.scripts]
"data-go-mcp.its-road-traffic" = "data_go_mcp.its_road_traffic.server:main"
"data-go-mcp.its-road-traffic-web" = "data_go_mcp.its_road_traffic.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_go_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_default_fixture_loop_scope = "function"
